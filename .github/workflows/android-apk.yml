# 안드로이드 설치 파일(APK) 빌드.
# 결과는 Actions 실행 화면의 Artifacts 와 `apk` 브랜치(최신 1개만 유지)에 올라간다.
# 개인 설치용이라 디버그 키로 서명한다. 구글 플레이 배포 시에는 별도 서명 키가 필요하다.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/engine.js"
      - "web/engine-data.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Generate native Android project
        working-directory: app
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        # 최신 갤럭시 등 64비트 기기용만 빌드해 시간과 용량을 줄인다.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk out/wine-sake-pairing.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: wine-sake-pairing-apk
          path: out/wine-sake-pairing.apk

      - name: Publish to apk branch
        working-directory: out
        run: |
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wine-sake-pairing.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
